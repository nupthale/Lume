    <text x="237" y="436" fill="#9AA3B5" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">{{TOC_ITEM_2_EN}}</text>
    <rect x="677" y="402" width="11" height="11" fill="#C9A227"/>
    <text x="711" y="408" fill="#5A6474" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17">{{TOC_ITEM_2_DESC}}</text>

    <!-- ==================== 目录卡片 3 ==================== -->
