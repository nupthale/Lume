<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
    <!-- ==================== 背景层：趋势线夜景图 + 罩层 ==================== -->
    <image xlink:href="chapter_bg.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1280" height="720" fill="#141B45" fill-opacity="0.4"/>
    <rect x="0" y="0" width="725" height="720" fill="#141B45" fill-opacity="0.8"/>

    <!-- ==================== 顶部品牌锚点 ==================== -->
    <rect x="53" y="61" width="11" height="11" fill="#C9A227"/>
    <text x="75" y="70" fill="#D8E2F8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">{{BRAND}}</text>

    <!-- ==================== 章节主内容（左对齐） ==================== -->
    <text x="81" y="290" fill="#C9A227" font-family="Songti SC, STSong, serif" font-size="101" font-weight="bold">{{CHAPTER_NUM}}</text>
    <text x="87" y="395" fill="#FFFFFF" font-family="Songti SC, STSong, serif" font-size="45" font-weight="bold">{{CHAPTER_TITLE}}</text>
    <text x="89" y="441" fill="#CADCFC" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" letter-spacing="2">{{CHAPTER_TITLE_EN}}</text>

    <!-- ==================== 子主题胶囊 ==================== -->
    <rect x="89" y="489" width="187" height="49" rx="24" fill="#CADCFC" stroke="#C9A227" stroke-width="1"/>
    <text x="182" y="520" text-anchor="middle" fill="#1E2761" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">{{CHAPTER_TAG_1}}</text>
    <rect x="300" y="489" width="187" height="49" rx="24" fill="#CADCFC" stroke="#C9A227" stroke-width="1"/>
    <text x="393" y="520" text-anchor="middle" fill="#1E2761" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">{{CHAPTER_TAG_2}}</text>
    <rect x="512" y="489" width="187" height="49" rx="24" fill="#CADCFC" stroke="#C9A227" stroke-width="1"/>
    <text x="605" y="520" text-anchor="middle" fill="#1E2761" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold">{{CHAPTER_TAG_3}}</text>

    <!-- ==================== 页脚 ==================== -->
    <text x="1232" y="687" text-anchor="end" fill="#D8E2F8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
