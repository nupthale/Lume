<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
    <!-- ==================== 背景层：夜景图 + 深蓝罩层 ==================== -->
    <image xlink:href="cover_bg.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1280" height="720" fill="#141B45" fill-opacity="0.55"/>

    <!-- ==================== 顶部品牌锚点 ==================== -->
    <rect x="53" y="61" width="11" height="11" fill="#C9A227"/>
    <text x="75" y="70" fill="#D8E2F8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">{{BRAND}}</text>
    <text x="1232" y="70" text-anchor="end" fill="#CADCFC" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13">{{EVENT_TAG}}</text>

    <!-- ==================== 主内容（居中） ==================== -->
    <rect x="548" y="219" width="17" height="17" fill="#C9A227"/>
    <text x="640" y="268" text-anchor="middle" fill="#C9A227" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">{{EYEBROW}}</text>
    <text x="640" y="362" text-anchor="middle" fill="#FFFFFF" font-family="Songti SC, STSong, serif" font-size="59" font-weight="bold" letter-spacing="4">{{TITLE}}</text>
    <text x="640" y="443" text-anchor="middle" fill="#CADCFC" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23">{{SUBTITLE}}</text>

    <!-- ==================== 底部信息 ==================== -->
    <text x="75" y="641" fill="#E6ECF8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16">{{AUTHOR}}</text>
    <text x="75" y="676" fill="#AEBBD8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">{{DATE}}</text>
    <text x="1232" y="676" text-anchor="end" fill="#AEBBD8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="2">{{CONFIDENTIAL}}</text>
</svg>
