<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
    <!-- ==================== 背景层：城市夜景 + 罩层 ==================== -->
    <image xlink:href="ending_bg.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1280" height="720" fill="#141B45" fill-opacity="0.5"/>

    <!-- ==================== 顶部品牌锚点 ==================== -->
    <rect x="53" y="61" width="11" height="11" fill="#C9A227"/>
    <text x="75" y="70" fill="#D8E2F8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14">{{BRAND}}</text>

    <!-- ==================== 结束主内容（居中） ==================== -->
    <rect x="629" y="221" width="17" height="17" fill="#C9A227"/>
    <text x="640" y="325" text-anchor="middle" fill="#FFFFFF" font-family="Songti SC, STSong, serif" font-size="56" font-weight="bold" letter-spacing="4">{{THANK_YOU}}</text>
    <text x="640" y="378" text-anchor="middle" fill="#C9A227" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="bold" letter-spacing="6">{{THANK_YOU_EN}}</text>
    <text x="640" y="440" text-anchor="middle" fill="#CADCFC" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20">{{TAGLINE}}</text>

    <!-- ==================== 底部联系信息 ==================== -->
    <text x="640" y="637" text-anchor="middle" fill="#D8E2F8" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15">{{CONTACT_INFO}}</text>
    <text x="1232" y="687" text-anchor="end" fill="#B9C4DC" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
