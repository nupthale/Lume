<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" style="background:#fafafa; border-radius:8px; font-family: system-ui, sans-serif;">
  <rect x="0" y="0" width="640" height="400" fill="#fafafa" rx="8"/>
  <text x="320" y="20" font-size="16" font-weight="bold" text-anchor="middle">2024 年度各季度销量</text>

  <!-- 绘图区 -->
  <g transform="translate(70, 40)">
    <!-- 数据绘制 -->
    <g id="columns">
      <!-- Q1 -->
      <rect x="0" y="244" width="100" height="36" fill="#4c78a8"/>
      <text x="50" y="228" font-size="12" text-anchor="middle">120</text>
      <!-- Q2 -->
      <rect x="140" y="66" width="100" height="324" fill="#4c78a8"/>
      <text x="210" y="50" font-size="12" text-anchor="middle">186</text>
      <!-- Q3 -->
      <rect x="280" y="122" width="100" height="258" fill="#4c78a8"/>
      <text x="330" y="106" font-size="12" text-anchor="middle">154</text>
      <!-- Q4 -->
      <rect x="420" y="-22" width="100" height="372" fill="#4c78a8"/>
      <text x="470" y="-8" font-size="12" text-anchor="middle">232</text>
    </g>

    <!-- y 轴网格 -->
    <g id="y-grid" stroke="#e0e0e0" stroke-dasharray="4 4">
      <!-- 纵向网格线位置手动计算 v=0,60,120,180,240 -->
      <line x1="0" y1="280" x2="540" y2="280"/>
      <line x1="0" y1="220" x2="540" y2="220"/>
      <line x1="0" y1="160" x2="540" y2="160"/>
      <line x1="0" y1="100" x2="540" y2="100"/>
      <line x1="0" y1="40" x2="540" y2="40"/>
    </g>

    <!-- y 数值标注 & x 类目标注 -->
    <g id="axes-labels">
      <text x="-10" y="285" font-size="11" fill="#888" text-anchor="end">0</text>
      <text x="-10" y="225" font-size="11" fill="#888" text-anchor="end">60</text>
      <text x="-10" y="165" font-size="11" fill="#888" text-anchor="end">120</text>
      <text x="-10" y="105" font-size="11" fill="#888" text-anchor="end">180</text>
      <text x="-10" y="45" font-size="11" fill="#888" text-anchor="end">240</text>

      <text x="50" y="320" font-size="12" text-anchor="middle">Q1</text>
      <text x="210" y="320" font-size="12" text-anchor="middle">Q2</text>
      <text x="330" y="320" font-size="12" text-anchor="middle">Q3</text>
      <text x="470" y="320" font-size="12" text-anchor="middle">Q4</text>
    </g>
  </g>
</svg>