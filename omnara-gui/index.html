<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Omnara GUI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #0f1117; color: #e6e8ee; height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
      background: #161923; border-bottom: 1px solid #262a38; flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header .status { font-size: 12px; color: #8b93a7; }
    header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    .dot.ok { background: #3fb950; } .dot.bad { background: #f85149; }
    .layout { display: flex; flex: 1; min-height: 0; }
    /* 侧栏：agent 列表 */
    aside {
      width: 220px; background: #131620; border-right: 1px solid #262a38;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    aside .aside-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 12px 8px; font-size: 12px; color: #8b93a7; text-transform: uppercase; letter-spacing: .5px;
    }
    aside .aside-head button {
      background: none; border: 1px solid #333849; color: #aab2c5; border-radius: 5px;
      padding: 2px 8px; cursor: pointer; font-size: 11px;
    }
    #agent-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .agent-item {
      padding: 10px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .agent-item:hover { background: #1b1f2d; }
    .agent-item.active { background: #1f2537; border-color: #3461d9; }
    .agent-item .name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .agent-item .meta { font-size: 11px; color: #7d8598; display: flex; gap: 8px; }
    .agent-item .state { padding: 0 6px; border-radius: 8px; font-size: 10px; line-height: 16px; }
    .state.active { background: #1f3a2b; color: #57d38f; }
    .state.archived { background: #3a2b2b; color: #d38f8f; }
    /* 主区域 */
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; gap: 2px; padding: 8px 12px 0; background: #161923; border-bottom: 1px solid #262a38; flex-shrink: 0; }
    .tab {
      padding: 7px 14px; font-size: 13px; cursor: pointer; color: #8b93a7;
      border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
    }
    .tab.active { color: #e6e8ee; background: #0f1117; border-color: #262a38; }
    .content { flex: 1; overflow-y: auto; padding: 16px 20px; min-height: 0; }
    /* 对话气泡 */
    .msg { margin-bottom: 14px; max-width: 85%; }
    .msg .who { font-size: 11px; color: #7d8598; margin-bottom: 4px; }
    .msg.user { margin-left: auto; }
    .msg.user .who { text-align: right; }
    .msg .bubble {
      padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: #2b4a86; border-top-right-radius: 4px; }
    .msg.assistant .bubble { background: #1b1f2d; border-top-left-radius: 4px; }
    .msg .bubble .thinking { color: #6b7387; font-size: 12px; display: block; margin-bottom: 6px; }
    .tool-chip {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-family: ui-monospace, monospace;
      background: #12241c; color: #57d38f; border: 1px solid #1f3a2b; border-radius: 6px;
      padding: 3px 8px; margin: 6px 0;
    }
    .tool-result {
      font-family: ui-monospace, monospace; font-size: 11px; background: #10131b;
      border: 1px solid #262a38; border-radius: 8px; padding: 8px 10px; margin: 6px 0;
      white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; color: #9aa3b8;
    }
    /* 记账表 */
    table.ledger { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.ledger th {
      text-align: left; color: #7d8598; font-weight: 500; padding: 8px 10px;
      border-bottom: 1px solid #262a38; position: sticky; top: -16px; background: #0f1117;
    }
    table.ledger td { padding: 7px 10px; border-bottom: 1px solid #1c202c; vertical-align: top; }
    table.ledger .seq { font-family: ui-monospace, monospace; color: #57d38f; }
    table.ledger .kind { font-family: ui-monospace, monospace; }
    .kind-agent_input { color: #6ea8fe; } .kind-model_output { color: #d2a8ff; } .kind-tool_result { color: #57d38f; }
    table.ledger .preview { color: #9aa3b8; max-width: 600px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    /* 输入区 */
    .composer {
      display: flex; gap: 10px; padding: 12px 16px; background: #161923;
      border-top: 1px solid #262a38; flex-shrink: 0;
    }
    .composer input {
      flex: 1; background: #0f1117; border: 1px solid #333849; color: #e6e8ee;
      border-radius: 8px; padding: 10px 14px; font-size: 13px; outline: none;
    }
    .composer input:focus { border-color: #3461d9; }
    .composer button {
      background: #3461d9; color: #fff; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 13px; cursor: pointer;
    }
    .composer button:disabled { background: #333849; cursor: not-allowed; }
    .empty { color: #6b7387; font-size: 13px; text-align: center; margin-top: 60px; }
  </style>
</head>
<body>
  <header>
    <h1>Omnara GUI</h1>
    <span class="status" id="conn-status"><span class="dot bad"></span>连接中…</span>
    <span class="status" id="scope-status" style="margin-left:auto"></span>
  </header>
  <div class="layout">
    <aside>
      <div class="aside-head">
        <span>Agents</span>
        <button id="btn-refresh">刷新</button>
      </div>
      <div id="agent-list"></div>
    </aside>
    <main>
      <div class="tabs">
        <div class="tab active" data-tab="chat">对话</div>
        <div class="tab" data-tab="ledger">记账（事件日志）</div>
      </div>
      <div class="content" id="content"><div class="empty">左侧选择一个 agent</div></div>
      <div class="composer">
        <input id="msg-input" type="text" placeholder="给 agent 发消息…" disabled />
        <button id="btn-send" disabled>发送</button>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
